name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m py_compile deploy/agent/agent_worker.py
      - run: python -m unittest discover -s deploy/agent -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.agent -t doppio-agent:ci .
      - run: docker build -f deploy/Dockerfile.manager -t doppio-manager:ci .
      # The real size, for the README's "Agent image" section.
      - run: docker image ls doppio-agent:ci
      # Every CLI and toolchain the image ships must answer --version. The
      # image's entrypoint is the worker, so override it with a shell.
      - run: >
          docker run --rm --entrypoint sh doppio-agent:ci -c
          'claude --version && codex --version && vibe --version &&
           qwen --version && gh --version && glab --version &&
           go version && node --version && npm --version && git --version'
      # The toolchains must be able to test a checkout of this repository.
      - run: >
          docker run --rm --entrypoint sh -v "$PWD":/checkout -w /checkout doppio-agent:ci -c
          'go test ./... && cd web && npm ci && npm run check'
